<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f0f0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007BFF;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IA Chat</h1>
    <input type="text" id="userInput" placeholder="Envoyez un message...">
    <button onclick="sendMessage()">Envoyer</button>
    <div id="chatWindow" style="margin-top: 20px; text-align: left; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #f9f9f9;"></div>
  </div>

  <script>
    async function sendMessage() {
      const userInput = document.getElementById('userInput').value;
      const chatWindow = document.getElementById('chatWindow');

      if (userInput.trim() === '') return;

      chatWindow.innerHTML += `<p><strong>Vous:</strong> ${userInput}</p>`;

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message: userInput }),
        });
        const data = await response.json();
        chatWindow.innerHTML += `<p><strong>IA:</strong> ${data.response}</p>`;
      } catch (error) {
        chatWindow.innerHTML += `<p><strong>Erreur:</strong> ${error.message}</p>`;
      }

      document.getElementById('userInput').value = '';
    }
  </script>
</body>
</html>
